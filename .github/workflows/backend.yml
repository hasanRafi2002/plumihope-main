name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plumihope
          POSTGRES_PASSWORD: plumihope
          POSTGRES_DB: plumihope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plumihope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://plumihope:plumihope@localhost:5432/plumihope
      JWT_SECRET: ci-only-not-a-secret
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: plumihope
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      PAYMENT_PROVIDER: sandbox
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build ./backend
